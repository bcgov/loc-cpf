openapi: 3.0.3
info:
  title: Batch Geocoder API
  version: 1.0.0
servers:
  - url: https://geocoderdlv.api.gov.bc.ca/batch/
    description: Development
  - url: https://geocodertst.api.gov.bc.ca/batch/
    description: Test
  - url: https://geocoder.api.gov.bc.ca/batch/
    description: Production
tags:
  - name: Jobs
    description: Operations related to geocoding jobs
paths:
  /api/jobs:
    get:
      tags:
        - Jobs
      summary: List geocoding jobs
      description: Retrieve a list of geocoding jobs.
      security:
        - ApiKey: []
      parameters:
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        '200':
          description: A paginated list of geocoding jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
        '401':
          description: Unauthorized - authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - Jobs
      summary: Create a geocoding job
      description: Create a new geocoding job. Supports both JSON and multipart/form-data requests.
      security:
        - ApiKey: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - endpoint_name
              properties:
                api_token:
                  type: string
                  description: API token, optional if header auth is used
                endpoint_name:
                  type: string
                  enum:
                    - Geocode
                options:
                  oneOf:
                    - type: object
                      additionalProperties:
                        type: string
                    - type: array
                      items:
                        type: object
                        required:
                          - name
                          - value
                        properties:
                          name:
                            type: string
                          value:
                            type: string
                input_data_content_type:
                  type: string
                  enum:
                    - text/csv
                    - text/tsv
                  default: text/csv
                output_file_format:
                  type: string
                  description: Final output file format used for the generated result file.
                  enum: [csv, tsv]
                  default: csv
                  example: tsv
                output_data_content_type:
                  type: string
                  description: Output MIME type (optional).
                  enum: [text/csv, text/tsv]
                  example: text/tsv
                input_data:
                  type: string
                  description: Input data as string
                input_data_url:
                  type: string
                  format: uri
                  description: URL to input data
                input_data_file:
                  type: string
                  format: binary
                  description: Input data file (multipart only)
              oneOf:
                - required:
                    - input_data
                - required:
                    - input_data_url
                - required:
                    - input_data_file
          application/json:
            schema:
              type: object
              required:
                - endpoint_name
              properties:
                api_token:
                  type: string
                  description: API token, optional if header auth is used
                endpoint_name:
                  type: string
                  enum:
                    - Geocode
                options:
                  oneOf:
                    - type: object
                      additionalProperties:
                        type: string
                    - type: array
                      items:
                        type: object
                        required:
                          - name
                          - value
                        properties:
                          name:
                            type: string
                          value:
                            type: string
                input_data_content_type:
                  type: string
                  enum:
                    - text/csv
                    - text/tsv
                  default: text/csv
                output_file_format:
                  type: string
                  description: Final output file format used for the generated result file.
                  enum: [csv, tsv]
                  default: csv
                  example: tsv
                input_data:
                  type: string
                  description: Input data as string
                input_data_url:
                  type: string
                  format: uri
                  description: URL to input data
              oneOf:
                - required:
                    - input_data
                - required:
                    - input_data_url
      responses:
        '201':
          description: Job created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              examples:
                tsvJobCreated:
                  summary: Job created with TSV output
                  value:
                    id: "job-123e4567-e89b-12d3-a456-426614174000"
                    status: "pending"
                    created_at: "2023-01-01 00:00:00"
                    total_rows: 1000
                    input_file_url: "https://example.com/input.tsv"
                    output_file_url: "https://example.com/output.tsv"
                    error_message: null
                    options:
                      some_option: "some_value"
                    output_file_format: tsv
        '401':
          description: Unauthorized - authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity - invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/jobs/{id}:
    get:
      tags:
        - Jobs
      summary: Get job status and details
      description: Retrieve the status and details of a geocoding job by ID.
      security:
        - ApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          description: Job identifier
          schema:
            type: string
      responses:
        '200':
          description: Job details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '401':
          description: Unauthorized - authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity - invalid job ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags:
        - Jobs
      summary: Delete a geocoding job
      description: Delete a geocoding job by its ID.
      security:
        - ApiKey: []
      parameters:
        - name: id
          in: path
          required: true
          description: Job identifier
          schema:
            type: string
      responses:
        '200':
          description: Job deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Job deleted successfully
        '401':
          description: Unauthorized - authentication failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Job not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity - invalid job ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: apikey
  schemas:
    Pagination:
      type: object
      required:
        - page
        - page_size
      properties:
        page:
          type: integer
          minimum: 1
          example: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        total:
          type: integer
          minimum: 0
          nullable: true
          example: 245
        total_pages:
          type: integer
          minimum: 0
          nullable: true
          example: 13
    JobListResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Job:
      type: object
      required:
        - id
        - status
        - created_at
      properties:
        id:
          type: string
          description: Unique job identifier
          example: "job-123e4567-e89b-12d3-a456-426614174000"
        status:
          type: string
          description: Current status of the job
          example: "pending"
        created_at:
          type: string
          format: string
          description: Job creation timestamp
          example: "2023-01-01 00:00:00"
        total_rows:
          type: integer
          description: Total number of addresses
          nullable: true
          example: 1000
        input_file_url:
          type: string
          format: uri
          description: URL to the input data file
          nullable: true
          example: "https://example.com/input.csv"
        output_file_url:
          type: string
          format: uri
          description: URL to the output data file
          nullable: true
          example: "https://example.com/output.csv"
        error_message:
          type: string
          description: Error message if job failed
          nullable: true
          example: "Invalid input data format"
        options:
          oneOf:
            - type: object
              additionalProperties:
                type: string
            - type: array
              items:
                type: object
                required:
                  - name
                  - value
                properties:
                  name:
                    type: string
                  value:
                    type: string
          description: Job options as object or array of name/value pairs
          nullable: true
        output_file_format:
          type: string
          description: Requested final output file format for output_file_url.
          enum: [csv, tsv]
          default: csv
          example: tsv
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message
          example: "Invalid request parameters"